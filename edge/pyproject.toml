[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dooh-edge"
version = "0.1.0"
description = "Edge agent: UVC camera audience analytics for DOOH screens"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    # opencv-python-headless keeps the thin-client install free of GUI libraries.
    "opencv-python-headless>=4.8",
    "onnxruntime>=1.16",
    "requests>=2.31",
    "tomli>=2.0; python_version<'3.11'",
]

[project.optional-dependencies]
dev = ["pytest>=8", "onnx>=1.15"]

[project.scripts]
dooh-edge = "dooh_edge.cli:main"

[tool.setuptools.packages.find]
include = ["dooh_edge*"]

[tool.setuptools.package-data]
dooh_edge = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
