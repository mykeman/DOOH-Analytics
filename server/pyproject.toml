[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dooh-server"
version = "0.1.0"
description = "Central reporting server and dashboard for DOOH audience analytics"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "sqlalchemy>=2.0",
    "pydantic>=2.5",
    "PyJWT>=2.8",
    "bcrypt>=4.1",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.1"]
dev = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
dooh-server = "dooh_server.cli:main"

[tool.setuptools.packages.find]
include = ["dooh_server*"]

[tool.setuptools.package-data]
dooh_server = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
